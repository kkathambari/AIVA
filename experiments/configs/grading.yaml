experiment:
  name: answer_assessment_grading_agreement
  version: "1.0.0"
  description: "Evaluates 4-dimensional rubric scoring against faculty consensus scores."

dataset:
  name: pilot_faculty_calibration_dataset
  path: "benchmark_data/pilot_evaluator_dataset.json"
  sample_count: 15

rubric:
  dimensions:
    correctness: 0.35
    completeness: 0.25
    evidence_alignment: 0.20
    reasoning_depth: 0.20

models:
  evaluator: "gemini-2.5-flash"
  structured_output: "AnswerEvaluation"
  temperature: 0.0

evaluation:
  script: "experiments/evaluation/evaluate_answer_assessment.py"
  output_artifact: "experiments/results/answer_assessment.json"
  metrics:
    - mae
    - rmse
    - pearson_r
    - spearman_rho
    - quadratic_weighted_kappa
    - calibration_error
