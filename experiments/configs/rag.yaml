experiment:
  name: hybrid_rag_retrieval_evaluation
  version: "1.0.0"
  description: "Compares Sparse BM25, Dense Semantic vector search, and Hybrid Reciprocal Rank Fusion."

dataset:
  corpus_passages: 11
  test_queries: 10

models:
  sparse: "BM25Okapi (technical_tokenize)"
  dense: "Google Generative AI Embedding 2 (cosine similarity)"
  hybrid: "Reciprocal Rank Fusion (RRF)"
  rrf_constant_k: 60

evaluation:
  script: "experiments/evaluation/evaluate_rag.py"
  output_artifact: "experiments/results/rag_evaluation.json"
  k_thresholds: [1, 3, 5]
  metrics:
    - mrr
    - recall@1
    - recall@3
    - recall@5
    - precision@1
    - precision@3
    - ndcg@3
    - ndcg@5
    - context_relevance
    - faithfulness_score
