name: AIVA CI & Scientific Verification Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r AIVA_backend/requirements.txt
          pip install httpx

      - name: Run Deterministic Offline Test Suite
        env:
          GOOGLE_API_KEY: "mock_ci_api_key_for_offline_deterministic_testing"
        run: |
          cd AIVA_backend
          python -m unittest tests.test_deterministic_end_to_end -v

      - name: Run UCS Engine Unit Tests
        run: |
          cd AIVA_backend
          python tests/test_ucs_selection.py

      - name: Run Persona Routing Sequence Tests
        run: |
          cd AIVA_backend
          python tests/test_routing_sequence.py

      - name: Run Scientific Release Verification Gate
        run: |
          cd AIVA_backend
          python experiments/validate_experiment_artifacts.py
